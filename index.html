<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <!-- Fase 3/10: favicons reales (copiados de public/icons). El manifest lo inyecta
         vite-plugin-pwa en build (ver vite.config.ts); estos meta tags de Apple no
         tienen equivalente automático y se portan a mano desde el index.html viejo. -->
    <link rel="icon" type="image/x-icon" href="/icons/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="theme-color" content="#09090b" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="KashFlow" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KashFlow</title>

    <!-- Fase 2: tipografia. Space Grotesk (montos/titulos) + DM Sans (UI), igual que el DESIGN.md original -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Fase 2: preflight anti-flash. Aplica el tema guardado antes de pintar, igual que el
         index.html viejo (public/index.html), para no heredar el flash de tema claro/oscuro. -->
    <script>
      ;(function () {
        try {
          var theme = localStorage.getItem('kf:theme') || 'dark'
          document.documentElement.dataset.theme = theme
          document.documentElement.classList.toggle('dark', theme === 'dark')
        } catch (e) {
          /* localStorage no disponible (SSR/privacidad) — se queda con el default dark del CSS */
        }
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
